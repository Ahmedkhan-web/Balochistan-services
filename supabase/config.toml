# Supabase local development configuration.
# Run `supabase start` to spin up a local stack, then `supabase db reset`
# to apply migrations in supabase/migrations and seed from supabase/seed.sql.

project_id = "balochistan-standard-services"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
